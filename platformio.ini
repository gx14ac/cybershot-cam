[platformio]
default_envs = esp32-s3-cam

[env:esp32-s3-cam]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
board_upload.flash_size = 16MB
build_flags =
    -DBOARD_HAS_PSRAM
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_rts = 0
monitor_dtr = 0
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@1.12.0
    adafruit/Adafruit GFX Library@1.13.0
    bitbank2/JPEGDEC@1.8.5

; Board-only test (no LCD, no joystick).
; Opens the CYBERSHOT access point at boot when no Wi-Fi is saved,
; and ignores the unwired joystick in the viewfinder.
; pio run -e bench -t upload
[env:bench]
extends = env:esp32-s3-cam
build_flags =
    ${env:esp32-s3-cam.build_flags}
    -DBENCH_AP
    -DBENCH_NO_JOY
